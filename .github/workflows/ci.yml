name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    # Porta por app: npm run test:coverage aplica vitest.config.ts.
    # Abaixo de 96% em linhas, funções ou ramos, em apps/bff ou em apps/web, o comando sai com erro.
    # Uma app não compensa a outra.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build --workspace @rick/web
      - run: docker compose build
      - run: npm audit --audit-level=high

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    # Porta de funções: o lcov do Flutter 3.47.5 não grava FN nem FNH.
    # Linhas executáveis cobertas sustentam as funções com corpo.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: npm ci
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test --coverage --branch-coverage
        working-directory: apps/mobile
      - name: Porta de cobertura
        run: node .github/workflows/flutter-coverage.mjs apps/mobile/coverage/lcov.info
      - name: Auditoria Pub
        run: node .github/workflows/pub-audit.mjs apps/mobile/pubspec.lock
      - name: KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: integration_test no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 2048
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect
          script: |
            set -eu
            export STUB_PORT=4011
            cd "$GITHUB_WORKSPACE"
            npx tsx apps/web/e2e/stub-bff.ts &
            stub_pid=$!
            trap 'kill "$stub_pid" >/dev/null 2>&1 || true' EXIT
            ready=0
            for _ in $(seq 1 30); do
              if node -e "fetch('http://127.0.0.1:4011/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" = 1
            cd apps/mobile
            flutter test \
              integration_test/catalog_test.dart \
              integration_test/order_test.dart \
              integration_test/detail_test.dart \
              integration_test/neighbors_test.dart \
              integration_test/filter_test.dart \
              integration_test/index_test.dart \
              --dart-define=BFF_ORIGIN=http://10.0.2.2:4011

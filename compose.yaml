services:
  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BFF_ORIGIN: http://bff:3001
    ports:
      - "3000:3000"
    environment:
      BFF_ORIGIN: http://bff:3001
    depends_on:
      bff:
        condition: service_healthy
